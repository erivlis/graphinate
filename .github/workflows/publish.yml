# This workflow will build and publish the Python package to PyPI using uv
# For more information see: https://docs.astral.sh/uv/

name: Publish
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to PyPI
    environment: pypi
    permissions:
      # Required for Trusted Publishing / OIDC authentication
      id-token: write
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Build package
        run: uv build
      - name: Publish package
        run: uv publish
