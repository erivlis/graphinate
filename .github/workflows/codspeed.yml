# This workflow runs the benchmark suite and reports the results to CodSpeed.
# For more information see: https://codspeed.io/docs/integrations/ci/github-actions

name: CodSpeed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up UV and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --all-extras --group test
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest benchmarks --codspeed
